[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bricklane"
version = "0.1.0"
description = "AI-native Web3 bug bounty hunter and security harness grounded in an exploit corpus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bricklane Contributors" }]
keywords = ["smart-contract", "security", "audit", "web3", "ai-native", "defi", "solidity", "vulnerability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "rich>=13.7",
    "platformdirs>=4.2",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/ch-i/bricklane-web3-bug-bounty-hunter"
Repository = "https://github.com/ch-i/bricklane-web3-bug-bounty-hunter"
Issues = "https://github.com/ch-i/bricklane-web3-bug-bounty-hunter/issues"
Documentation = "https://github.com/ch-i/bricklane-web3-bug-bounty-hunter#readme"

[project.optional-dependencies]
# Local embedding model. Heavy install; opt-in.
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Jupyter + analysis stack for notebooks/blockchain-explorer.ipynb
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "pandas>=2.2",
    "networkx>=3.3",
    "matplotlib>=3.8",
]
# MCP server runtime.
mcp = [
    "mcp[cli]>=1.2",
]
# Slither: the always-on static analyzer.
# (Halmos and Mythril are installed separately via pipx since they pin
#  conflicting z3-solver / web3 versions and are CLI-only.)
static = [
    "slither-analyzer>=0.10",
]
# Scraping with a real browser (Solodit, etc).
scrape = [
    "playwright>=1.43",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
ui = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
bricklane-mcp = "mcp_server.server:main"
bricklane-ingest = "scripts.ingest_md:main"
bricklane-seed-swc = "scripts.seed_swc:main"
bricklane = "harness.tui:main"
bl = "harness.tui:main"
w3s = "harness.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["harness", "crawlers", "mcp_server", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
