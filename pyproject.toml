[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web3sentinel"
version = "0.0.1"
description = "Smart contract & web3 audit harness with an autoresearch corpus loop"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "web3Sentinel" }]

dependencies = [
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.1",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "feedparser>=6.0",
    "rich>=13.7",
    "platformdirs>=4.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local embedding model. Heavy install; opt-in.
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# MCP server runtime.
mcp = [
    "mcp[cli]>=1.2",
]
# Slither: the always-on static analyzer.
# (Halmos and Mythril are installed separately via pipx since they pin
#  conflicting z3-solver / web3 versions and are CLI-only.)
static = [
    "slither-analyzer>=0.10",
]
# Scraping with a real browser (Solodit, etc).
scrape = [
    "playwright>=1.43",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
web3sentinel-mcp = "mcp_server.server:main"
web3sentinel-ingest = "scripts.ingest_md:main"
web3sentinel-seed-swc = "scripts.seed_swc:main"
w3s = "harness.tui:main"

[tool.hatch.build.targets.wheel]
packages = ["harness", "crawlers", "mcp_server", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
