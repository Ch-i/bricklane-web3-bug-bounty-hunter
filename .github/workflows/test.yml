name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies (base + mcp + static + dev)
        run: uv sync --extra mcp --extra static --extra dev

      - name: Install solc via solc-select
        # Slither needs a solc binary; solc-select is bundled with the
        # slither-analyzer extra and provides this.
        run: |
          uv run solc-select install 0.8.20
          uv run solc-select use 0.8.20

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q
